# Publica o blog a partir do Supabase.
#
# Disparado por:
#   - botão "Publicar" no /admin/ (via Edge Function "publish" do Supabase)
#   - manualmente: GitHub → Actions → "Publicar blog" → Run workflow
#   - mudanças no gerador (build.py, blog_theme.py, blog-config.json, este arquivo)
#
# O que faz: busca os posts publicados no Supabase, regenera blog/, covers/,
# RSS, sitemap e o bloco "últimos posts" da home; faz commit só se algo mudou
# e pede um novo build do GitHub Pages.

name: Publicar blog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.py
      - blog_theme.py
      - blog-config.json
      - .github/workflows/blog.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar-blog
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # sempre a versão mais nova da main (não a do momento do disparo)
      - uses: actions/checkout@v5
        with:
          ref: main

      # Só para as imagens de capa. Se o espelho do Ubuntu travar, segue sem
      # instalar: o blog é publicado do mesmo jeito (só capas novas ficam para depois).
      - name: Ferramentas para as capas (SVG → PNG)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if command -v rsvg-convert >/dev/null 2>&1; then echo "rsvg-convert já disponível"; exit 0; fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y -qq --no-install-recommends librsvg2-bin fonts-dejavu-core > /dev/null

      - name: Gerar e publicar
        id: commit
        run: |
          git config user.name  "jpmarson-blog[bot]"
          git config user.email "jpmarson@gmail.com"
          # Até 3 tentativas: se alguém publicou algo na main durante o build,
          # recomeça sobre a versão mais nova em vez de falhar.
          for tentativa in 1 2 3; do
            python3 build.py
            git add -A .   # o build só escreve arquivos do blog
            if git diff --cached --quiet; then
              echo "Nada mudou no blog."
              exit 0
            fi
            git commit -q -m "Blog: publica alterações do Supabase"
            if git push -q; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "A main avançou durante o build (tentativa $tentativa). Refazendo sobre a versão mais nova…"
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "Não foi possível publicar após 3 tentativas." >&2
          exit 1

      - name: Atualizar GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Commits feitos pelo GITHUB_TOKEN podem não disparar o Pages sozinhos;
          # pedir o build explicitamente garante a publicação.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || \
            echo "Aviso: não foi possível solicitar o build do Pages (ele pode já estar em andamento)."
