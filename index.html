<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Marson</title>
<meta name="description" content="JP Marson — Liderança em gestão de projetos e tecnologia para o mercado financeiro. Fundador da Jurik.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a66ff'/><text x='50' y='68' font-size='48' fill='white' text-anchor='middle' font-family='monospace' font-weight='bold'>jp</text></svg>">
<style>
  :root{
    --bg:#fafbfd;
    --surface:#ffffff;
    --text:#0f172a;
    --muted:#5b6b83;
    --accent:#0a66ff;
    --accent-soft:#e8f0ff;
    --border:#e4e9f2;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  /* subtle tech grid background */
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:linear-gradient(var(--border) 1px,transparent 1px),
                     linear-gradient(90deg,var(--border) 1px,transparent 1px);
    background-size:48px 48px;
    opacity:.35;
    pointer-events:none;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 0%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 0%,transparent 70%);
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 24px;position:relative}
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:28px 0;
  }
  .logo{
    font-family:var(--mono);
    font-weight:700;font-size:1.05rem;letter-spacing:-.5px;
    color:var(--text);text-decoration:none;
  }
  .logo span{color:var(--accent)}
  .lang{display:flex;gap:4px;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--surface)}
  .lang button{
    font-family:var(--mono);font-size:.72rem;
    border:0;background:transparent;color:var(--muted);
    padding:5px 12px;border-radius:999px;cursor:pointer;transition:.2s;
  }
  .lang button.active{background:var(--accent);color:#fff}
  .lang button:not(.active):hover{color:var(--accent)}
  main{padding:56px 0 32px}
  .tag{
    font-family:var(--mono);font-size:.78rem;color:var(--accent);
    background:var(--accent-soft);border:1px solid #cfe0ff;
    display:inline-block;padding:4px 12px;border-radius:999px;margin-bottom:24px;
  }
  h1{
    font-size:clamp(2.4rem,7vw,3.6rem);
    letter-spacing:-.03em;line-height:1.08;font-weight:800;
  }
  h1 .cursor{
    display:inline-block;width:.55ch;color:var(--accent);
    animation:blink 1.1s steps(1) infinite;font-weight:400;
  }
  @keyframes blink{50%{opacity:0}}
  .subtitle{font-size:1.15rem;color:var(--muted);margin:20px 0 0;max-width:56ch}
  .cards{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:48px 0 0;
  }
  @media(max-width:600px){.cards{grid-template-columns:1fr}}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:24px;transition:.25s;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,102,255,.08)}
  .card .k{font-family:var(--mono);font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
  .card h3{font-size:1.08rem;margin:8px 0 6px;letter-spacing:-.01em}
  .card p{font-size:.92rem;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:12px;margin:48px 0 0}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:.85rem;text-decoration:none;
    padding:11px 20px;border-radius:10px;transition:.2s;
  }
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:#0852cc}
  .btn.ghost{border:1px solid var(--border);color:var(--text);background:var(--surface)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  footer{
    border-top:1px solid var(--border);margin-top:72px;padding:24px 0 40px;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:.75rem;color:var(--muted);
  }
  footer .status{display:inline-flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.4}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#">jp<span>.</span>marson</a>
    <nav class="lang" aria-label="Idioma">
      <button data-lang="pt" class="active">PT</button>
      <button data-lang="en">EN</button>
      <button data-lang="es">ES</button>
    </nav>
  </header>

  <main>
    <div class="tag" data-i18n="tag"></div>
    <h1>JP Marson<span class="cursor">_</span></h1>
    <p class="subtitle" data-i18n="subtitle"></p>

    <div class="cards">
      <div class="card">
        <div class="k" data-i18n="c1k"></div>
        <h3 data-i18n="c1t"></h3>
        <p data-i18n="c1p"></p>
      </div>
      <div class="card">
        <div class="k" data-i18n="c2k"></div>
        <h3>Jurik</h3>
        <p data-i18n="c2p"></p>
      </div>
    </div>

    <div class="links">
      <a class="btn primary" href="mailto:jpmarson@gmail.com" data-i18n="contact"></a>
      <a class="btn ghost" href="https://www.linkedin.com/in/jpmarson" target="_blank" rel="noopener">LinkedIn</a>
      <a class="btn ghost" href="https://github.com/jpmarson" target="_blank" rel="noopener">GitHub</a>
    </div>
  </main>

  <footer>
    <span>© <span id="year"></span> jpmarson.com.br</span>
    <span class="status"><span class="dot"></span><span data-i18n="status"></span></span>
  </footer>
</div>

<script>
const i18n = {
  pt:{
    tag:"// gestão de projetos & tecnologia",
    subtitle:"Líder de times de gestão de projetos no mercado financeiro. Conectando estratégia, tecnologia e entrega em produtos de pagamento e adquirência.",
    c1k:"carreira",
    c1t:"Liderança em Projetos",
    c1p:"Gestão de times de project managers em produtos financeiros, adquirência e projetos regulatórios e de plataforma.",
    c2k:"empreendedorismo",
    c2p:"Fundador da Jurik — due diligence para o mercado imobiliário no Brasil, trazendo segurança jurídica a transações de imóveis.",
    contact:"Fale comigo",
    status:"disponível para conexões"
  },
  en:{
    tag:"// project management & technology",
    subtitle:"Leader of project management teams in the financial industry. Connecting strategy, technology and delivery across payment and acquiring products.",
    c1k:"career",
    c1t:"Project Leadership",
    c1p:"Managing project manager teams across financial products, merchant acquiring, and regulatory & platform initiatives.",
    c2k:"entrepreneurship",
    c2p:"Founder of Jurik — due diligence for the real estate market in Brazil, bringing legal certainty to property transactions.",
    contact:"Get in touch",
    status:"open to connect"
  },
  es:{
    tag:"// gestión de proyectos & tecnología",
    subtitle:"Líder de equipos de gestión de proyectos en el mercado financiero. Conectando estrategia, tecnología y entrega en productos de pago y adquirencia.",
    c1k:"carrera",
    c1t:"Liderazgo en Proyectos",
    c1p:"Gestión de equipos de project managers en productos financieros, adquirencia y proyectos regulatorios y de plataforma.",
    c2k:"emprendimiento",
    c2p:"Fundador de Jurik — due diligence para el mercado inmobiliario en Brasil, aportando seguridad jurídica a las transacciones de inmuebles.",
    contact:"Contáctame",
    status:"abierto a conexiones"
  }
};
function setLang(l){
  document.documentElement.lang = l==="pt"?"pt-BR":l;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = i18n[l][el.dataset.i18n] || ""; });
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));
  try{ localStorage.setItem("lang",l); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
document.getElementById("year").textContent = new Date().getFullYear();
let saved = null;
try{ saved = localStorage.getItem("lang"); }catch(e){}
setLang(saved && i18n[saved] ? saved : "pt");
</script>
</body>
</html>
